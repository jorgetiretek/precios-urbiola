<style>

:root{--bg:#0d0d0f;--surface:#141417;--surface2:#1c1c21;--border:#2a2a32;--accent:#22c55e;--accent2:#16a34a;--gold:#f59e0b;--text:#e8e8f0;--muted:#6b6b80;--premium:#ffd700;--inter:#60d9f9;--vol:#a78bfa;--remate:#fb923c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:360px;text-align:center;}
.login-logo{width:56px;height:56px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;}
.login-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;padding:13px 16px;outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px;transition:border-color 0.2s;}
.login-input:focus{border-color:var(--accent);}
.login-input.error{border-color:var(--remate);}
.btn-login{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:13px;cursor:pointer;margin-bottom:10px;}
.login-error{color:var(--remate);font-size:13px;min-height:18px;}
.header{background:linear-gradient(135deg,#0d1f0e 0%,#0d0d0f 60%);border-bottom:1px solid #1a3020;padding:16px 16px 14px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;line-height:1;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;padding:11px 14px;outline:none;letter-spacing:1px;transition:border-color 0.2s;}
.search-input::placeholder{color:var(--muted);font-weight:400;letter-spacing:0;font-family:'DM Sans',sans-serif;}
.search-input:focus{border-color:var(--accent);}
.btn-search{background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;}
.btn-search:active{background:var(--accent2);}
.info-bar{padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);}
.main{padding:12px 14px 0;max-width:680px;margin:0 auto;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:52px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.7;}
.section-header{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.section-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;padding:3px 10px;border-radius:4px;white-space:nowrap;}
.section-line{flex:1;height:1px;}
.badge-premium{background:#2d2600;color:var(--premium);border:1px solid #5a4e00;}.line-premium{background:linear-gradient(90deg,#5a4e00,transparent);}
.badge-inter{background:#001d2d;color:var(--inter);border:1px solid #004060;}.line-inter{background:linear-gradient(90deg,#004060,transparent);}
.badge-vol{background:#1a1030;color:var(--vol);border:1px solid #3d2a70;}.line-vol{background:linear-gradient(90deg,#3d2a70,transparent);}
.badge-remate{background:#2d1200;color:var(--remate);border:1px solid #6b3000;}.line-remate{background:linear-gradient(90deg,#6b3000,transparent);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:9px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.brand-name{font-weight:700;font-size:16px;color:var(--accent);line-height:1.2;}
.model-name{font-size:12px;color:var(--muted);margin-top:2px;}

.exist-badge.high{color:var(--accent);border-color:#1a4a28;background:#0d2a18;}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.price-item{background:var(--surface2);border-radius:8px;padding:7px 10px;}
.price-item.span2{grid-column:1 / -1;}
.price-item.promo{background:#1a2200;border:1px solid #3d5200;}
.price-item.remate-item{background:#2a1400;border:1px solid #6b3000;}
.price-label{font-size:10px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;font-weight:500;margin-bottom:2px;}
.price-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--text);}
.price-val.green{color:var(--accent);}.price-val.gold{color:var(--gold);}.price-val.orange{color:var(--remate);}
.promo-tag{font-size:12px;font-weight:700;color:#a3e635;}
.footer-card{background:var(--surface2);border:1px solid #1a3020;border-radius:12px;padding:14px;margin-top:22px;}
.footer-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;}
.footer-subtitle{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.footer-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.footer-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 8px;background:var(--surface);border-radius:6px;border:1px solid var(--border);}
.copy-wrap{margin-top:18px;padding-bottom:20px;}
.btn-copy{width:100%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-copy:active{transform:scale(0.98);}
.btn-copy.copied{background:linear-gradient(135deg,#1d4ed8,#1e40af);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:10px 24px;border-radius:50px;font-weight:700;font-size:14px;transition:transform 0.3s ease;z-index:9998;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.no-results .icon{font-size:36px;margin-bottom:10px;}
@media(max-width:380px){.price-grid{grid-template-columns:1fr;}.footer-items{grid-template-columns:1fr;}.price-item.span2{grid-column:1;}}
</style>

var textoWA='';

(function(){
  function intentar(){
    var val=document.getElementById('loginInput').value.trim();
    if(val===CLAVE){
      document.getElementById('loginOverlay').style.display='none';
    } else {
      var inp=document.getElementById('loginInput');
      inp.classList.add('error');
      document.getElementById('loginError').textContent='Clave incorrecta.';
      inp.value='';
      setTimeout(function(){inp.classList.remove('error');document.getElementById('loginError').textContent='';},1500);
    }
  }
  document.getElementById('btnLogin').addEventListener('click',intentar);
  document.getElementById('loginInput').addEventListener('keydown',function(e){if(e.key==='Enter')intentar();});
})();

function buscar(){
  var q=document.getElementById('searchInput').value.trim().replace(/\s+/g,' ').toUpperCase();
  if(!q) return;
  var found=datos.filter(function(r){return String(r.medida||'').trim().replace(/\s+/g,' ').toUpperCase()===q;});
  if(!found.length){setMain('<div class="no-results"><div class="icon">🔍</div>No se encontró <strong>'+q+'</strong></div>');return;}

  var premiums=[],intermed=[],volumen=[],remates=[];
  found.forEach(function(r){
    var cat=String(r.cat||'').trim().toLowerCase(), marca=String(r.marca||'').trim();
    if(cat==='remate'){remates.push(r);return;}
    if(cat==='premium'||inList(PREMIUM_ORDER,marca)){premiums.push(r);return;}
    if(cat==='intermedia'||inList(INTER_ORDER,marca)){intermed.push(r);return;}
    volumen.push(r);
  });

  premiums.sort(function(a,b){return getIdx(PREMIUM_ORDER,a.marca)-getIdx(PREMIUM_ORDER,b.marca);});
  intermed.sort(function(a,b){var d=getIdx(INTER_ORDER,a.marca)-getIdx(INTER_ORDER,b.marca);return d!==0?d:num(b.p1)-num(a.p1);});
  volumen.sort(function(a,b){return num(b.p1)-num(a.p1);});
  remates.sort(function(a,b){return num(b.remate)-num(a.remate);});

  var html='';
  textoWA='🛞 *MEDIDA: '+q+'*\n━━━━━━━━━━━━━━━━━━━━━━\n';

  function sec(lista,tipo,emoji,cls){
    if(!lista.length) return;
    html+='<div class="section-header"><div class="section-badge badge-'+cls+'">'+tipo+'</div><div class="section-line line-'+cls+'"></div></div>';
    textoWA+='\n'+emoji+' *'+tipo+'*\n─────────────────────\n';
    lista.forEach(card);
  }

  function card(r){
    var marca=String(r.marca||'').trim(), modelo=String(r.modelo||'').trim();
    var existN=parseInt(r.exist)||0, eStr=existN>10?'10+':String(existN), eCls=existN>10?'high':'';
    var msi=r.msi, esPromo=String(msi).toLowerCase().indexOf('promo')!==-1;
    var msiN=esPromo?0:num(msi);
    var p1=num(r.p1),p2=num(r.p2),p4=num(r.p4),rem=num(r.remate);

    html+='<div class="card"><div class="card-top"><div><div class="brand-name">'+marca+'</div>';
    if(modelo) html+='<div class="model-name">'+modelo+'</div>';
    html+='</div><div class="exist-badge '+eCls+'">📦 '+eStr+'</div></div>';
    html+='<div class="price-grid">';
    if(esPromo) html+='<div class="price-item promo span2"><div class="promo-tag">⚡ PROMOCIÓN EN MSI</div></div>';
    else if(msiN>0) html+='<div class="price-item span2"><div class="price-label">💳 6 MSI</div><div class="price-val gold">'+fmt(msiN)+'</div></div>';
    html+='<div class="price-item"><div class="price-label">💵 Precio u./1 pza</div><div class="price-val green">'+fmt(p1)+'</div></div>';
    html+='<div class="price-item"><div class="price-label">💵 Precio u./Set 2 pzas</div><div class="price-val">'+fmt(p2)+'</div></div>';
    html+='<div class="price-item span2"><div class="price-label">💵 Precio u./Set 4 pzas</div><div class="price-val">'+fmt(p4)+'</div></div>';
    if(rem>0) html+='<div class="price-item remate-item span2"><div class="price-label">🔖 Precio Remate</div><div class="price-val orange">'+fmt(rem)+'</div></div>';
    html+='</div></div>';

    textoWA+='\n*'+marca.toUpperCase()+'*';
    if(modelo) textoWA+=' - '+modelo;
    textoWA+='\n📦 Disponibles: '+eStr+'\n';
    if(esPromo) textoWA+='⚡ PROMOCION EN MSI\n';
    else if(msiN>0) textoWA+='💳 6 MSI: '+fmt(msiN)+'\n';
    textoWA+='💵 Precio u./1 pza: '+fmt(p1)+'\n';
    textoWA+='💵 Precio u./Set 2 pzas: '+fmt(p2)+'\n';
    textoWA+='💵 Precio u./Set 4 pzas: '+fmt(p4)+'\n';
    if(rem>0) textoWA+='🔖 Remate: '+fmt(rem)+'\n';
  }

  sec(premiums,'PREMIUM','⭐','premium');
  sec(intermed,'INTERMEDIA','🔵','inter');
  sec(volumen,'VOLUMEN','🟣','vol');
  sec(remates,'REMATE','🔥','remate');

  textoWA+='\n━━━━━━━━━━━━━━━━━━━━━━\n💲 *Precios Unitarios*\n\n🎁 *Gratis:*\n🔧 Montaje\n🔩 Válvula\n⚖️ Balanceo\n💨 Nitrógeno\n';

  html+='<div class="footer-card"><div class="footer-title">💲 Precios Unitarios</div><div class="footer-subtitle">🎁 Gratis:</div><div class="footer-items"><div class="footer-item">🔧 Montaje</div><div class="footer-item">🔩 Válvula</div><div class="footer-item">⚖️ Balanceo</div><div class="footer-item">💨 Nitrógeno</div></div></div>';
  html+='<div class="copy-wrap"><button class="btn-copy" id="btnCopy">📋 Copiar para WhatsApp</button></div>';
  setMain(html);
  document.getElementById('btnCopy').addEventListener('click',function(){copiar(textoWA,'btnCopy');});
}

function copiar(texto,btnId){
  if(!texto) return;
  var btn=document.getElementById(btnId), toast=document.getElementById('toast');
  function onOk(){var orig=btn.textContent;btn.textContent='✅ ¡Copiado!';btn.classList.add('copied');toast.classList.add('show');setTimeout(function(){btn.textContent=orig;btn.classList.remove('copied');toast.classList.remove('show');},2500);}
  function fallback(){var ta=document.createElement('textarea');ta.value=texto;ta.setAttribute('readonly','');ta.style.cssText='position:absolute;left:-9999px;top:0;';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(ok){onOk();}else{alert('No se pudo copiar.');}}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(texto).then(onOk,fallback);}else{fallback();}
}

function setMain(h){document.getElementById('main').innerHTML=h;}
function num(v){var n=parseFloat(String(v||'').replace(/[$,\s]/g,''));return isNaN(n)?0:n;}
function fmt(n){return n?'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';}
function inList(arr,val){var v=String(val||'').trim().toLowerCase();for(var i=0;i<arr.length;i++){if(arr[i].toLowerCase()===v)return true;}return false;}
function getIdx(arr,val){var v=String(val||'').trim().toLowerCase();for(var i=0;i<arr.length;i++){if(arr[i].toLowerCase()===v)return i;}return 99;}

document.getElementById('btnBuscar').addEventListener('click',buscar);
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')buscar();});
</script>
