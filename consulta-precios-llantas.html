<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Precios · Urbiola Llantas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root {
  --bg:#0d0d0f; --surface:#141417; --surface2:#1c1c21; --border:#2a2a32;
  --accent:#22c55e; --accent2:#16a34a; --gold:#f59e0b; --text:#e8e8f0; --muted:#6b6b80;
  --premium:#ffd700; --inter:#60d9f9; --vol:#a78bfa; --remate:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}

/* HEADER */
.header{background:linear-gradient(135deg,#0d1f0e 0%,#0d0d0f 60%);border-bottom:1px solid #1a3020;padding:16px 16px 14px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;line-height:1;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;padding:11px 14px;outline:none;letter-spacing:1px;transition:border-color 0.2s;}
.search-input::placeholder{color:var(--muted);font-weight:400;letter-spacing:0;font-family:'DM Sans',sans-serif;}
.search-input:focus{border-color:var(--accent);}
.btn-search{background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;}
.btn-search:active{background:var(--accent2);}
.btn-search:disabled{background:#2a4a2a;color:#4a6a4a;cursor:not-allowed;}

/* STATUS BAR */
.status-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s;}
.status-dot.loading{background:var(--gold);animation:pulse 1s infinite;}
.status-dot.ready{background:var(--accent);}
.status-dot.error{background:var(--remate);}
.status-text{font-size:13px;color:var(--muted);flex:1;}
.btn-reload{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;font-size:11px;padding:4px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.btn-reload:hover{border-color:var(--accent);color:var(--accent);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* MAIN */
.main{padding:12px 14px 0;max-width:680px;margin:0 auto;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:52px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.7;}

/* SECTION */
.section-header{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.section-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;padding:3px 10px;border-radius:4px;white-space:nowrap;}
.section-line{flex:1;height:1px;}
.badge-premium{background:#2d2600;color:var(--premium);border:1px solid #5a4e00;}
.line-premium{background:linear-gradient(90deg,#5a4e00,transparent);}
.badge-inter{background:#001d2d;color:var(--inter);border:1px solid #004060;}
.line-inter{background:linear-gradient(90deg,#004060,transparent);}
.badge-vol{background:#1a1030;color:var(--vol);border:1px solid #3d2a70;}
.line-vol{background:linear-gradient(90deg,#3d2a70,transparent);}
.badge-remate{background:#2d1200;color:var(--remate);border:1px solid #6b3000;}
.line-remate{background:linear-gradient(90deg,#6b3000,transparent);}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:9px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.brand-name{font-weight:700;font-size:16px;color:var(--accent);line-height:1.2;}
.model-name{font-size:12px;color:var(--muted);margin-top:2px;}
.exist-badge{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.exist-badge.high{color:var(--accent);border-color:#1a4a28;background:#0d2a18;}

/* PRICE GRID */
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.price-item{background:var(--surface2);border-radius:8px;padding:7px 10px;}
.price-item.span2{grid-column:1 / -1;}
.price-item.promo{background:#1a2200;border:1px solid #3d5200;}
.price-item.remate-item{background:#2a1400;border:1px solid #6b3000;}
.price-label{font-size:10px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;font-weight:500;margin-bottom:2px;}
.price-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--text);}
.price-val.green{color:var(--accent);}
.price-val.gold{color:var(--gold);}
.price-val.orange{color:var(--remate);}
.promo-tag{font-size:12px;font-weight:700;color:#a3e635;}

/* FOOTER */
.footer-card{background:var(--surface2);border:1px solid #1a3020;border-radius:12px;padding:14px;margin-top:22px;}
.footer-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;}
.footer-subtitle{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.footer-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.footer-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 8px;background:var(--surface);border-radius:6px;border:1px solid var(--border);}

/* COPY BTN */
.copy-wrap{margin-top:18px;padding-bottom:20px;}
.btn-copy{width:100%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.5px;}
.btn-copy:active{transform:scale(0.98);}
.btn-copy.copied{background:linear-gradient(135deg,#1d4ed8,#1e40af);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:10px 24px;border-radius:50px;font-weight:700;font-size:14px;transition:transform 0.3s ease;z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.no-results .icon{font-size:36px;margin-bottom:10px;}

@media(max-width:380px){
  .price-grid{grid-template-columns:1fr;}
  .footer-items{grid-template-columns:1fr;}
  .price-item.span2{grid-column:1;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo-icon">🛞</div>
    <div>
      <div class="logo-text">URBIOLA LLANTAS</div>
      <div class="logo-sub">Consulta de Precios</div>
    </div>
  </div>
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="Ej: 185 65 R15" autocomplete="off" />
    <button class="btn-search" id="btnBuscar" disabled>🔍 Buscar</button>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot loading" id="statusDot"></div>
  <div class="status-text" id="statusText">Cargando lista de precios...</div>
  <button class="btn-reload" id="btnReload" onclick="cargarDatos()">↻ Recargar</button>
</div>

<div class="main" id="main">
  <div class="empty-state">
    <div class="big">⏳</div>
    <p>Cargando precios desde el servidor...<br>Un momento por favor.</p>
  </div>
</div>

<div class="toast" id="toast">✅ ¡Copiado!</div>

<script>
// ===================== CONFIG =====================
var SHEET_ID = '1BOCGphrrbeqjpgDAmd4zD6pr5SWcszrriyZTu3UMPAc';
var SHEET_NAME = 'Precios';
var EXPORT_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=xlsx&gid=0';

// Columnas EXACTAS de la hoja "Precios"
var C_MEDIDA  = 'Medida';
var C_MARCA   = 'Marca';
var C_MODELO  = 'Modelo';
var C_MSI     = 'Precio MSI';
var C_P1      = 'Precio Mostrador 1 pz';
var C_P2      = 'Precio U. Set 2 pz';
var C_P4      = 'Precio U. Set 4 pzas';
var C_REMATE  = 'Precio Remate';
// Existencias vienen de hoja Inventario Bot pero no está en Precios Bot
// Se usará Observaciones si existe, sino se omite existencia

var PREMIUM_ORDER = ['Michelin','BFGoodrich','Continental','Goodyear','Bridgestone'];
var INTER_ORDER   = ['Cooper','Firestone','Kelly','Mastercraft','Sumitomo','Nexen','Toyo','Venom','Milestar','Paragon','General','Euzkadi'];

var datos = null;
var textoWA = '';

// ===================== CARGA AUTOMÁTICA =====================
function cargarDatos() {
  setStatus('loading', 'Cargando lista de precios...');
  document.getElementById('btnBuscar').disabled = true;
  setMain('<div class="empty-state"><div class="big">⏳</div><p>Cargando precios...</p></div>');

  // Usamos un proxy CORS para evitar bloqueos del navegador
  var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(EXPORT_URL);

  fetch(proxyUrl)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    })
    .then(function(buf) {
      var wb = XLSX.read(new Uint8Array(buf), {type:'array'});

      // Buscar hoja Precios
      var sn = null;
      for (var i = 0; i < wb.SheetNames.length; i++) {
        if (wb.SheetNames[i].toLowerCase().indexOf('precios') !== -1) {
          sn = wb.SheetNames[i];
          break;
        }
      }
      if (!sn) sn = wb.SheetNames[0];

      datos = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:''});

      var n = datos.length;
      setStatus('ready', '✅ ' + n + ' productos cargados — ' + new Date().toLocaleTimeString('es-MX'));
      document.getElementById('btnBuscar').disabled = false;
      setMain('<div class="empty-state"><div class="big">🛞</div><p>Lista lista. Escribe una medida y presiona Buscar.</p></div>');
    })
    .catch(function(err) {
      setStatus('error', '❌ Error al cargar. Verifica conexión y que el archivo sea público.');
      document.getElementById('btnBuscar').disabled = false;
      setMain('<div class="empty-state"><div class="big">⚠️</div><p>No se pudo cargar la lista.<br>Presiona <strong>↻ Recargar</strong> para intentar de nuevo.</p></div>');
      console.error(err);
    });
}

function setStatus(state, text) {
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;
  txt.textContent = text;
}

// ===================== BUSCAR =====================
function buscar() {
  var q = document.getElementById('searchInput').value.trim().replace(/\s+/g,' ').toUpperCase();
  if (!q) return;
  if (!datos) { setMain('<div class="no-results"><div class="icon">📂</div>Espera a que cargue la lista.</div>'); return; }

  var found = datos.filter(function(r) {
    return String(r[C_MEDIDA]||'').trim().replace(/\s+/g,' ').toUpperCase() === q;
  });

  if (!found.length) {
    setMain('<div class="no-results"><div class="icon">🔍</div>No se encontró <strong>' + q + '</strong> en la lista.</div>');
    return;
  }

  // Clasificar
  var premiums=[], intermed=[], volumen=[], remates=[];
  found.forEach(function(r) {
    var marca = String(r[C_MARCA]||'').trim();
    var rem   = num(r[C_REMATE]);

    if (rem > 0 && num(r[C_P1]) === 0) {
      remates.push(r);
    } else if (inList(PREMIUM_ORDER, marca)) {
      premiums.push(r);
    } else if (inList(INTER_ORDER, marca)) {
      intermed.push(r);
    } else {
      volumen.push(r);
    }
  });

  // Ordenar
  premiums.sort(function(a,b){ return idx(PREMIUM_ORDER,a[C_MARCA]) - idx(PREMIUM_ORDER,b[C_MARCA]); });
  intermed.sort(function(a,b){
    var d = idx(INTER_ORDER,a[C_MARCA]) - idx(INTER_ORDER,b[C_MARCA]);
    return d !== 0 ? d : num(b[C_P1]) - num(a[C_P1]);
  });
  volumen.sort(function(a,b){ return num(b[C_P1]) - num(a[C_P1]); });
  remates.sort(function(a,b){ return num(b[C_REMATE]) - num(a[C_REMATE]); });

  var html = '';
  textoWA = '🛞 *MEDIDA: ' + q + '*\n━━━━━━━━━━━━━━━━━━━━━━\n';

  function renderSec(lista, tipo, emoji, cls) {
    if (!lista.length) return;
    html += '<div class="section-header"><div class="section-badge badge-'+cls+'">'+tipo+'</div><div class="section-line line-'+cls+'"></div></div>';
    textoWA += '\n'+emoji+' *'+tipo+'*\n─────────────────────\n';
    lista.forEach(function(r){ buildCard(r); });
  }

  function buildCard(r) {
    var marca   = String(r[C_MARCA]  || '').trim();
    var modelo  = String(r[C_MODELO] || '').trim();
    var msiRaw  = String(r[C_MSI]    || '').trim();
    var esPromo = msiRaw.toLowerCase()==='promoción' || msiRaw.toLowerCase()==='promocion';
    var msiN    = esPromo ? 0 : num(r[C_MSI]);
    var p1      = num(r[C_P1]);
    var p2      = num(r[C_P2]);
    var p4      = num(r[C_P4]);
    var rem     = num(r[C_REMATE]);

    // HTML
    html += '<div class="card">';
    html += '<div class="card-top">';
    html += '<div><div class="brand-name">'+marca+'</div>';
    if (modelo) html += '<div class="model-name">'+modelo+'</div>';
    html += '</div></div>';
    html += '<div class="price-grid">';

    if (esPromo) {
      html += '<div class="price-item promo span2"><div class="promo-tag">⚡ PROMOCIÓN EN MSI</div></div>';
    } else if (msiN > 0) {
      html += '<div class="price-item span2"><div class="price-label">💳 6 MSI</div><div class="price-val gold">'+fmt(msiN)+'</div></div>';
    }

    html += '<div class="price-item"><div class="price-label">💵 Precio u./1 pza</div><div class="price-val green">'+fmt(p1)+'</div></div>';
    html += '<div class="price-item"><div class="price-label">💵 Precio u./Set 2 pzas</div><div class="price-val">'+fmt(p2)+'</div></div>';
    html += '<div class="price-item span2"><div class="price-label">💵 Precio u./Set 4 pzas</div><div class="price-val">'+fmt(p4)+'</div></div>';
    if (rem > 0) {
      html += '<div class="price-item remate-item span2"><div class="price-label">🔖 Precio Remate</div><div class="price-val orange">'+fmt(rem)+'</div></div>';
    }
    html += '</div></div>';

    // WhatsApp
    textoWA += '\n*'+marca.toUpperCase()+'*';
    if (modelo) textoWA += ' - '+modelo;
    textoWA += '\n';
    if (esPromo)     textoWA += '⚡ PROMOCION EN MSI\n';
    else if (msiN>0) textoWA += '💳 6 MSI: '+fmt(msiN)+'\n';
    textoWA += '💵 Precio u./1 pza: '+fmt(p1)+'\n';
    textoWA += '💵 Precio u./Set 2 pzas: '+fmt(p2)+'\n';
    textoWA += '💵 Precio u./Set 4 pzas: '+fmt(p4)+'\n';
    if (rem>0) textoWA += '🔖 Remate: '+fmt(rem)+'\n';
  }

  renderSec(premiums, 'PREMIUM',    '⭐', 'premium');
  renderSec(intermed, 'INTERMEDIA', '🔵', 'inter');
  renderSec(volumen,  'VOLUMEN',    '🟣', 'vol');
  renderSec(remates,  'REMATE',     '🔥', 'remate');

  textoWA += '\n━━━━━━━━━━━━━━━━━━━━━━\n💲 *Precios Unitarios*\n\n🎁 *Gratis:*\n🔧 Montaje\n🔩 Válvula\n⚖️ Balanceo\n💨 Nitrógeno\n';

  html += '<div class="footer-card"><div class="footer-title">💲 Precios Unitarios</div><div class="footer-subtitle">🎁 Gratis:</div><div class="footer-items"><div class="footer-item">🔧 Montaje</div><div class="footer-item">🔩 Válvula</div><div class="footer-item">⚖️ Balanceo</div><div class="footer-item">💨 Nitrógeno</div></div></div>';
  html += '<div class="copy-wrap"><button class="btn-copy" id="btnCopy">📋 Copiar para WhatsApp</button></div>';

  setMain(html);
  document.getElementById('btnCopy').addEventListener('click', copiar);
}

// ===================== COPIAR =====================
function copiar() {
  if (!textoWA) return;
  var btn   = document.getElementById('btnCopy');
  var toast = document.getElementById('toast');

  function onOk() {
    btn.textContent = '✅ ¡Copiado!';
    btn.classList.add('copied');
    toast.classList.add('show');
    setTimeout(function(){
      btn.textContent = '📋 Copiar para WhatsApp';
      btn.classList.remove('copied');
      toast.classList.remove('show');
    }, 2500);
  }

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = textoWA;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:absolute;left:-9999px;top:0;font-size:16px;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0,99999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    if (ok) { onOk(); } else { alert('No se pudo copiar automáticamente. Intenta de nuevo.'); }
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(textoWA).then(onOk, fallback);
  } else {
    fallback();
  }
}

// ===================== UTILS =====================
function setMain(h) { document.getElementById('main').innerHTML = h; }
function num(v) { var n=parseFloat(String(v||'').replace(/[$,\s]/g,'')); return isNaN(n)?0:n; }
function fmt(n) { return n ? '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; }
function inList(arr,val) { var v=String(val||'').trim().toLowerCase(); for(var i=0;i<arr.length;i++){if(arr[i].toLowerCase()===v)return true;} return false; }
function idx(arr,val) { var v=String(val||'').trim().toLowerCase(); for(var i=0;i<arr.length;i++){if(arr[i].toLowerCase()===v)return i;} return 99; }

// ===================== EVENTOS =====================
document.getElementById('btnBuscar').addEventListener('click', buscar);
document.getElementById('searchInput').addEventListener('keydown', function(e){ if(e.key==='Enter') buscar(); });

// Cargar al iniciar
cargarDatos();
</script>
</body>
</html>
