body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}

.login-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;}
.login-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;padding:13px 16px;outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px;transition:border-color 0.2s;}
.login-input:focus{border-color:var(--accent);}.login-input.error{border-color:var(--remate);}
.btn-login{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:13px;cursor:pointer;margin-bottom:10px;}
.login-error{color:var(--remate);font-size:13px;min-height:18px;}
.header{background:linear-gradient(135deg,#0d1f0e 0%,#0d0d0f 60%);border-bottom:1px solid #1a3020;padding:16px 16px 14px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;line-height:1;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;padding:11px 14px;outline:none;letter-spacing:1px;transition:border-color 0.2s;}
.search-input::placeholder{color:var(--muted);font-weight:400;letter-spacing:0;font-family:'DM Sans',sans-serif;}
.search-input:focus{border-color:var(--accent);}
.btn-search{background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;}
.info-bar{padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);}
.main{padding:12px 14px 0;max-width:680px;margin:0 auto;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:52px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.7;}
.section-header{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.section-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;padding:3px 10px;border-radius:4px;white-space:nowrap;}
.section-line{flex:1;height:1px;}
.badge-premium{background:#2d2600;color:var(--premium);border:1px solid #5a4e00;}.line-premium{background:linear-gradient(90deg,#5a4e00,transparent);}
.badge-inter{background:#001d2d;color:var(--inter);border:1px solid #004060;}.line-inter{background:linear-gradient(90deg,#004060,transparent);}
.badge-vol{background:#1a1030;color:var(--vol);border:1px solid #3d2a70;}.line-vol{background:linear-gradient(90deg,#3d2a70,transparent);}
.badge-tbr{background:#2d0a1f;color:var(--tbr);border:1px solid #6b1a45;}.line-tbr{background:linear-gradient(90deg,#6b1a45,transparent);}
.badge-otr{background:#2d1500;color:var(--otr);border:1px solid #7c3500;}.line-otr{background:linear-gradient(90deg,#7c3500,transparent);}
.tipo-badge{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:2px;padding:2px 7px;border-radius:4px;margin-bottom:4px;}
.tipo-PCR{background:#0a2010;color:var(--accent);border:1px solid #1a4020;}
.tipo-ATV{background:#1a0a30;color:var(--vol);border:1px solid #3d1a70;}
.tipo-Moto{background:#1a1a00;color:#facc15;border:1px solid #4a4a00;}
.tipo-TBR{background:#2d0a1f;color:var(--tbr);border:1px solid #6b1a45;}
.tipo-OTR{background:#2d1500;color:var(--otr);border:1px solid #7c3500;}

.card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}

.exist-line{font-size:12px;color:var(--muted);margin-top:4px;}

.price-row.remate-row{background:#2a1400;border:1px solid #6b3000;}
.price-row.rev-row{background:#001828;border:1px solid #0369a1;}
.price-row.verano-row{background:#052818;border:1px solid #065f46;}
.price-row.flotillas-row{background:#1a1000;border:1px solid #78350f;}

.footer-subtitle{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.footer-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.no-results .icon{font-size:36px;margin-bottom:10px;}

var cardData={};
var todosSeleccionados=true;

(function(){
  function go(){
    var v=document.getElementById('loginInput').value.trim();
    if(v===CLAVE){document.getElementById('loginOverlay').style.display='none';}
    else{
      var inp=document.getElementById('loginInput');
      inp.classList.add('error');
      document.getElementById('loginError').textContent='Clave incorrecta.';
      inp.value='';
      setTimeout(function(){inp.classList.remove('error');document.getElementById('loginError').textContent='';},1500);
    }
  }
  document.getElementById('btnLogin').addEventListener('click',go);
  document.getElementById('loginInput').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
})();

function norm(m){
  return String(m||'').toUpperCase()
    .replace(/[\s\-\/\*X]+/g,' ')
    .replace(/\.50\b/g,'.5').replace(/\.00\b/g,'')
    .replace(/C$/,'').replace(/\s+/g,' ').trim();
}

function toggleSelAll(){
  var chks=document.querySelectorAll('.cc');
  todosSeleccionados=!todosSeleccionados;
  chks.forEach(function(c){c.checked=todosSeleccionados;});
  var btn=document.getElementById('btnSelAll');
  if(btn) btn.innerHTML=todosSeleccionados?'&#9745; Deseleccionar todo':'&#9744; Seleccionar todo';
}

function buscar(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q)return;
  var qn=norm(q);
  var found=datos.filter(function(r){return norm(r.medida)===qn;});
  if(!found.length){
    setMain('<div class="no-results"><div class="icon">&#128269;</div>No se encontro <strong>'+esc(q)+'</strong></div>');
    return;
  }
  var esPCR=found.some(function(r){return String(r.tipo||'').toUpperCase()==='PCR';});
  var prem=[],inter=[],vol=[],tbr=[],otr=[];
  found.forEach(function(r){
    var t=String(r.tipo||'').toUpperCase();
    if(t==='TBR'){tbr.push(r);return;}
    if(t==='OTR'){otr.push(r);return;}
    var m=String(r.marca||'').trim();
    if(inL(PREMIUM,m)){prem.push(r);return;}
    if(inL(INTER,m)){inter.push(r);return;}
    vol.push(r);
  });
  prem.sort(function(a,b){return idxL(PREMIUM,a.marca)-idxL(PREMIUM,b.marca);});
  inter.sort(function(a,b){var d=idxL(INTER,a.marca)-idxL(INTER,b.marca);return d||num(b.p4||b.p1)-num(a.p4||a.p1);});
  vol.sort(function(a,b){return num(b.p4||b.p1)-num(a.p4||a.p1);});
  tbr.sort(function(a,b){return num(b.p1)-num(a.p1);});
  otr.sort(function(a,b){return num(b.p4||b.p1)-num(a.p4||a.p1);});

  cardData={};var ci=0;todosSeleccionados=true;
  var h='<div class="select-all-bar"><button class="btn-sel-all" id="btnSelAll" onclick="toggleSelAll()">&#9745; Deseleccionar todo</button><span class="sel-all-hint">o selecciona individualmente</span></div>';

  function sec(list,tit,cls){
    if(!list.length)return;
    h+='<div class="section-header"><div class="section-badge badge-'+cls+'">'+tit+'</div><div class="section-line line-'+cls+'"></div></div>';
    list.forEach(function(r){var id='c'+ci;cardData[id]=r;ci++;h+=buildCard(r,id);});
  }
  sec(prem,'PREMIUM','premium');
  sec(inter,'INTERMEDIA','inter');
  sec(vol,'VOLUMEN','vol');
  sec(tbr,'CAMION / TBR','tbr');
  sec(otr,'OTR / MAQUINARIA','otr');

  var med=found[0].medida||q;
  if(esPCR){
    h+='<div class="footer-card"><div class="footer-title">Precios Unitarios</div><div class="footer-subtitle">&#127381; Gratis:</div><div class="footer-items"><div class="footer-item">&#128295; Montaje</div><div class="footer-item">&#128297; Valvula</div><div class="footer-item">&#9878; Balanceo</div><div class="footer-item">&#128168; Nitrogeno</div></div></div>';
  }
  h+='<div class="vigencia">&#9888; Precios vigentes hasta el 31 de julio de 2026</div>';
  h+='<div class="copy-section"><button class="btn-copy" id="btnC">&#128203; Copiar cotizacion cliente</button>';
  if(esPCR)h+='<button class="btn-copy-rev" id="btnR">&#127978; Copiar cotizacion revendedor</button>';
  h+='</div>';

  setMain(h);
  document.getElementById('btnC').addEventListener('click',function(){cop(med,false,esPCR);});
  if(esPCR)document.getElementById('btnR').addEventListener('click',function(){cop(med,true,false);});
}

function tipoLabel(t){var m={'PCR':'PCR','ATV':'ATV','Moto':'MOTO','TBR':'TBR','OTR':'OTR'};return m[t]||t;}
function tipoIcon(t){var m={'PCR':'&#128994;','ATV':'&#127951;','Moto':'&#127949;','TBR':'&#128667;','OTR':'&#128661;'};return m[t]||'&#128994;';}
function tipoClass(t){var m={'PCR':'tipo-PCR','ATV':'tipo-ATV','Moto':'tipo-Moto','TBR':'tipo-TBR','OTR':'tipo-OTR'};return m[t]||'tipo-PCR';}

function buildCard(r,id){
  var ma=String(r.marca||'').trim(),mo=String(r.modelo||'').trim(),desc=String(r.desc||'').trim();
  var tipo=String(r.tipo||'').trim();
  var ex=parseInt(r.exist)||0,es=ex>10?'10+':String(ex),ec=ex>10?'high':'';
  var ms=r.msi,pr=String(ms).toLowerCase().indexOf('promo')!==-1,mn=pr?0:num(ms);
  var p1=num(r.p1),p2=num(r.p2),p4=num(r.p4),rv=num(r.rev),rm=num(r.remate),ve=num(r.verano),fl=num(r.flotillas);
  var isTBR=(tipo==='TBR');
  var bord=isTBR?'border-color:#3d1a2e;':tipo==='OTR'?'border-color:#4a2000;':'';
  var h='<div class="card" id="'+id+'" style="'+bord+'">';
  h+='<div class="card-header"><div class="checkbox-wrap"><input type="checkbox" class="cc" data-id="'+id+'" checked></div>';
  h+='<div class="card-title"><span class="tipo-badge '+tipoClass(tipo)+'">'+tipoLabel(tipo)+'</span>';
  h+='<div class="brand-line">'+tipoIcon(tipo)+' <strong>'+esc(ma)+'</strong>';
  if(mo)h+=' &mdash; <span style="font-weight:400;color:var(--muted)">'+esc(mo)+'</span>';
  h+='</div>';
  if(desc)h+='<div class="desc-line">'+esc(desc)+'</div>';
  h+='<div class="exist-line">Existencia: <span class="exist-num '+ec+'">'+es+' pzas</span></div>';
  h+='</div></div><div class="price-table">';
  if(pr)h+='<div class="price-row promo-row"><span class="promo-tag">&#9889; PROMOCION EN MSI</span></div>';
  else if(mn>0)h+='<div class="price-row"><span class="price-lbl">&#128179; 6 MSI</span><span class="price-amt gold">'+fmt(mn)+'</span></div>';
  if(ve>0)h+='<div class="price-row verano-row"><span class="price-lbl">&#9728; Promo Verano</span><span class="price-amt green">'+fmt(ve)+'</span></div>';
  if(isTBR){
    if(p1>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./1-3 pzas</span><span class="price-amt">'+fmt(p1)+'</span></div>';
    if(p2>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./4-11 pzas</span><span class="price-amt">'+fmt(p2)+'</span></div>';
    if(p4>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./12+ pzas</span><span class="price-amt">'+fmt(p4)+'</span></div>';
  } else {
    if(p1>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./1 pza</span><span class="price-amt">'+fmt(p1)+'</span></div>';
    if(p2>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./Set 2 pzas</span><span class="price-amt">'+fmt(p2)+'</span></div>';
    if(p4>0)h+='<div class="price-row"><span class="price-lbl">&#128181; Precio u./Set 4 pzas</span><span class="price-amt">'+fmt(p4)+'</span></div>';
  }
  if(rm>0)h+='<div class="price-row remate-row"><span class="price-lbl">&#128278; Precio Remate</span><span class="price-amt orange">'+fmt(rm)+'</span></div>';
  if(rv>0)h+='<div class="price-row rev-row"><span class="price-lbl">&#127978; Precio Revendedor</span><span class="price-amt blue">'+fmt(rv)+'</span></div>';
  if(fl>0)h+='<div class="price-row flotillas-row"><span class="price-lbl">&#127970; Flotillas Michelin</span><span class="price-amt amber">'+fmt(fl)+'</span></div>';
  return h+'</div></div>';
}

function cop(med,esRev,incSvc){
  var chks=document.querySelectorAll('.cc:checked');
  if(!chks.length){alert('Selecciona al menos una llanta.');return;}
  var SEP='\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501';
  var t='\ud83d\udee5 *MEDIDA: '+med+'*\n'+SEP+'\n';
  chks.forEach(function(c){
    var r=cardData[c.getAttribute('data-id')];if(!r)return;
    var tipo=String(r.tipo||'').trim();
    var isTBR=(tipo==='TBR');
    var ma=String(r.marca||'').trim(),mo=String(r.modelo||'').trim();
    var ex=parseInt(r.exist)||0,es=ex>10?'10+':String(ex);
    var ms=r.msi,pr=String(ms).toLowerCase().indexOf('promo')!==-1,mn=pr?0:num(ms);
    var p1=num(r.p1),p2=num(r.p2),p4=num(r.p4),rv=num(r.rev),rm=num(r.remate),ve=num(r.verano),fl=num(r.flotillas);
    var icons={'PCR':'\ud83d\udfe2','ATV':'\ud83d\udfe3','Moto':'\ud83d\udfe1','TBR':'\ud83d\ude9b','OTR':'\ud83d\ude95'};
    var ico=icons[tipo]||'\ud83d\udfe2';
    t+='\n'+ico+' *'+ma.toUpperCase()+'* ['+tipoLabel(tipo)+']';
    if(mo)t+=' - '+mo;
    t+='\n   Existencia: '+es+' pzas\n';
    if(esRev){
      if(rv>0)t+='   \ud83c\udfe0 Precio Revendedor:    '+fmt(rv)+'\n';
      if(rm>0)t+='   \ud83d\udd16 Precio Remate:        '+fmt(rm)+'\n';
      if(ve>0)t+='   \u2600\ufe0f Promo Verano:         '+fmt(ve)+'\n';
      if(fl>0)t+='   \ud83c\udfe2 Flotillas Michelin:   '+fmt(fl)+'\n';
    } else {
      if(pr)t+='   \u26a1 PROMOCION EN MSI\n';
      else if(mn>0)t+='   \ud83d\udcb3 6 MSI:                '+fmt(mn)+'\n';
      if(ve>0)t+='   \u2600\ufe0f Promo Verano:         '+fmt(ve)+'\n';
      if(isTBR){
        if(p1>0)t+='   \ud83d\udcb5 Precio u./1-3 pzas:  '+fmt(p1)+'\n';
        if(p2>0)t+='   \ud83d\udcb5 Precio u./4-11 pzas: '+fmt(p2)+'\n';
        if(p4>0)t+='   \ud83d\udcb5 Precio u./12+ pzas:  '+fmt(p4)+'\n';
      } else {
        if(p1>0)t+='   \ud83d\udcb5 Precio u./1 pza:      '+fmt(p1)+'\n';
        if(p2>0)t+='   \ud83d\udcb5 Precio u./Set 2 pzas: '+fmt(p2)+'\n';
        if(p4>0)t+='   \ud83d\udcb5 Precio u./Set 4 pzas: '+fmt(p4)+'\n';
        if(rm>0)t+='   \ud83d\udd16 Precio Remate:        '+fmt(rm)+'\n';
        if(fl>0)t+='   \ud83c\udfe2 Flotillas Michelin:   '+fmt(fl)+'\n';
      }
    }
  });
  t+='\n'+SEP+'\n\u26a0\ufe0f Precios vigentes hasta el 31 de julio de 2026\n';
  if(incSvc&&!esRev)t+='\n\ud83d\udcb2 *Precios Unitarios*\n\n\ud83c\udf81 *Gratis:*\n\ud83d\udd27 Montaje\n\ud83d\udd29 Valvula\n\u2696\ufe0f Balanceo\n\ud83d\udca8 Nitrogeno\n';
  var bid=esRev?'btnR':'btnC';
  var btn=document.getElementById(bid),toast=document.getElementById('toast');
  function ok(){var o=btn.textContent;btn.textContent='Copiado!';btn.classList.add('copied');toast.classList.add('show');setTimeout(function(){btn.textContent=o;btn.classList.remove('copied');toast.classList.remove('show');},2500);}
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:absolute;left:-9999px;';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);var r2=false;try{r2=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(r2)ok();else alert('No se pudo copiar.');}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb);}else{fb();}
}

function setMain(h){document.getElementById('main').innerHTML=h;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function num(v){var n=parseFloat(String(v||'').replace(/[$,\s]/g,''));return isNaN(n)?0:n;}
function fmt(n){return n?'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}):'--';}
function inL(a,v){var x=String(v||'').trim().toLowerCase();for(var i=0;i<a.length;i++){if(a[i].toLowerCase()===x)return true;}return false;}
function idxL(a,v){var x=String(v||'').trim().toLowerCase();for(var i=0;i<a.length;i++){if(a[i].toLowerCase()===x)return i;}return 99;}

document.getElementById('btnBuscar').addEventListener('click',buscar);
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')buscar();});
</script>
